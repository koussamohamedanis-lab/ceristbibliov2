server {
    listen 80;
    server_name localhost;

    # ── Frontend (React SPA) ──────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets directly
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API reverse proxy ─────────────────────
    # All /api, /auth, /hierarchy, /registration, /chat,
    # /messaging, /uploads requests → FastAPI backend
    location ~ ^/(api|auth|hierarchy|registration|chat|messaging|uploads|docs|openapi.json|redoc)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for /messaging/ws)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running sync operations
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── React Router: fallback to index.html ──────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
